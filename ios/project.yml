# XcodeGen-Projektdefinition — erzeugt Dottie.xcodeproj:
#   brew install xcodegen && cd ios && xcodegen
#
# Vorher muessen beide Frameworks gebaut sein:
#   ./gradlew :core:assembleDottieCoreDebugXCFramework
#   ./gradlew :ui:assembleDottieUiDebugXCFramework
#
# DottieUi bringt die komplette Oberflaeche mit (Compose Multiplatform),
# DottieCore die Spiellogik. Was in Swift bleibt, ist der Einstieg.
name: Dottie
options:
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
targets:
  Dottie:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Dottie/Sources
      - path: Dottie/Resources
    dependencies:
      # Statische Frameworks: Sie werden beim Linken einverleibt und
      # muessen weder eingebettet noch signiert werden.
      - framework: ../ui/build/XCFrameworks/debug/DottieUi.xcframework
        embed: false
      - framework: ../core/build/XCFrameworks/debug/DottieCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.robinrehbein.dottie
        PRODUCT_NAME: Dottie
        INFOPLIST_FILE: Dottie/Info.plist
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic

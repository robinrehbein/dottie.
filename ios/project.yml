# XcodeGen-Projektdefinition — erzeugt Dottie.xcodeproj:
#   brew install xcodegen && cd ios && xcodegen
#
# Vorher muss das Framework mit der Spiellogik gebaut sein:
#   ./gradlew :core:assembleDottieCoreDebugXCFramework
# Es entsteht in core/build/XCFrameworks/debug/ und wird von beiden
# Targets von dort gelinkt (siehe ios/README.md).
name: Dottie
options:
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
targets:
  Dottie:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Dottie/Sources
      - path: Dottie/Resources
    dependencies:
      # Statisches Framework: Es wird beim Linken einverleibt und muss
      # weder eingebettet noch signiert werden — deshalb embed: false.
      - framework: ../core/build/XCFrameworks/debug/DottieCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.robinrehbein.dottie
        PRODUCT_NAME: Dottie
        INFOPLIST_FILE: Dottie/Info.plist
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - DottieTests
      gatherCoverageData: false

  # Logik-Tests ohne Host-App: Das Bundle uebersetzt die Bruecke zu
  # :core direkt mit, dadurch braucht es weder TEST_HOST noch
  # Signierung und laeuft im Simulator der CI ohne weitere Einrichtung.
  DottieTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: DottieTests
      - path: Dottie/Sources/Core
      # Die Tests pruefen, ob es zu jedem Namen aus :core einen Text
      # gibt — dafuer muss die Tabelle im Test-Bundle liegen.
      - path: Dottie/Resources/en.lproj/Localizable.strings
        buildPhase: resources
    dependencies:
      - framework: ../core/build/XCFrameworks/debug/DottieCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.robinrehbein.dottie.tests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

name: Build iOS

# Der Lauf ist der einzige Kompilier-Beweis für die iOS-App — auf einem
# Linux-Rechner gibt es keine Apple-Toolchain, ein Fehler fiele sonst
# erst beim Öffnen in Xcode auf. Er ist zugleich der einzige Ort, an dem
# die Spiellogik überhaupt für Apple übersetzt wird: :core ist ein
# Multiplattform-Modul, und seine Apple-Ziele bauen nur auf einem Mac.
#
# Früher war der Trigger bewusst nur manuell, weil macOS-Minuten auf
# privaten Repos das Zehnfache kosten. Seit das Repo öffentlich ist,
# entfällt der Grund: Für öffentliche Repositories sind die Läufe
# kostenlos. Deshalb jetzt automatisch — bei Änderungen am
# iOS-Verzeichnis, an diesem Workflow und an der Vergleichsgrundlage
# (parity/ und core/, denn die geben die Soll-Werte vor).
#
# Die Arbeits-Branches heißen alle claude/** und stehen deshalb wie in
# build-apk.yml direkt im Push-Trigger; ein zusätzlicher
# pull_request-Trigger würde jeden Lauf nur verdoppeln.
on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - "ios/**"
      - "parity/**"
      - "core/**"
      - ".github/workflows/build-ios.yml"
  workflow_dispatch:

jobs:
  build:
    # macos-15: XcodeGen 2.45+ schreibt das Xcode-16-Projektformat
    # (objectVersion 77), das Xcode 15.4 auf macos-14 nicht lesen kann.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Neuestes installiertes Xcode aktivieren — das Image-Default kann
      # älter sein als das, was das Projektformat verlangt.
      - name: Neuestes Xcode auswählen
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Nutze $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Die Spiellogik als XCFramework — beide Xcode-Targets linken es
      # aus core/build/XCFrameworks/debug/ (siehe ios/project.yml). Ohne
      # diesen Schritt findet xcodebuild das Framework nicht.
      #
      # Gradle konfiguriert dabei auch die Android-Module und braucht
      # dafür den SDK-Pfad; auf den macOS-Runnern steht er in
      # ANDROID_HOME.
      - name: Spiellogik als XCFramework bauen
        run: |
          if [ -n "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi
          ./gradlew --no-daemon :core:assembleDottieCoreDebugXCFramework
          ls -la core/build/XCFrameworks/debug

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt generieren
        run: |
          cd ios
          xcodegen

      # Brücken-Tests: Seit die Engine aus :core kommt, gibt es nichts
      # mehr nachzurechnen — geprüft wird, was CoreBridge.swift von Hand
      # macht (abgeleitete Textschlüssel, Familien, Requisiten-Formen)
      # und dass das Framework wirklich verlinkt ist. Läuft zuerst, damit
      # ein inhaltlicher Fehler nicht hinter zwei Builds versteckt ist.
      - name: Brücken-Tests im Simulator
        run: |
          cd ios
          # Irgendein verfügbares iOS-Simulator-Gerät: Die Namen der Images
          # (iPhone 15/16/…) ändern sich mit jeder Runner-Generation, die
          # UDID-Abfrage überlebt das.
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json, sys; devices = json.load(sys.stdin)['devices']; print(next(e[0]['udid'] for r, e in devices.items() if 'iOS' in r and e))")
          echo "Simulator: $UDID"
          xcodebuild test -project Dottie.xcodeproj -scheme Dottie \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

      # Device-Build (generic/platform=iOS): beweist, dass der Code für
      # echte Geräte kompiliert und linkt. Ohne Signierung — dafür bräuchte
      # es einen Apple-Developer-Account (siehe ios/README.md).
      - name: Build für iOS-Geräte (unsigniert)
        run: |
          cd ios
          xcodebuild -project Dottie.xcodeproj -scheme Dottie \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build

      # Simulator-Build: gleiche Quellen, x86_64/arm64-Simulator-Slice.
      # Die entstehende .app läuft direkt im Xcode-Simulator (Drag & Drop
      # oder `xcrun simctl install booted Dottie.app`).
      - name: Build für iOS-Simulator
        run: |
          cd ios
          xcodebuild -project Dottie.xcodeproj -scheme Dottie \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Simulator-App als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: dottie-ios-simulator-app
          path: ios/build/Build/Products/Debug-iphonesimulator/Dottie.app

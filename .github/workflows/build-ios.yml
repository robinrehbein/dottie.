name: Build iOS

# NUR manuell (Actions → Build iOS → "Run workflow"): macOS-Minuten
# kosten auf privaten Repos das 10-fache der Linux-Minuten — deshalb
# bewusst kein push-Trigger. Der Lauf ist der Kompilier-Beweis für den
# Swift-Port, denn lokal gibt es keine Apple-Toolchain.
on:
  workflow_dispatch:

jobs:
  build:
    # macos-15: XcodeGen 2.45+ schreibt das Xcode-16-Projektformat
    # (objectVersion 77), das Xcode 15.4 auf macos-14 nicht lesen kann.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Neuestes installiertes Xcode aktivieren — das Image-Default kann
      # älter sein als das, was das Projektformat verlangt.
      - name: Neuestes Xcode auswählen
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Nutze $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt generieren
        run: |
          cd ios
          xcodegen

      # Device-Build (generic/platform=iOS): beweist, dass der Code für
      # echte Geräte kompiliert und linkt. Ohne Signierung — dafür bräuchte
      # es einen Apple-Developer-Account (siehe ios/README.md).
      - name: Build für iOS-Geräte (unsigniert)
        run: |
          cd ios
          xcodebuild -project Dottie.xcodeproj -scheme Dottie \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build

      # Simulator-Build: gleiche Quellen, x86_64/arm64-Simulator-Slice.
      # Die entstehende .app läuft direkt im Xcode-Simulator (Drag & Drop
      # oder `xcrun simctl install booted Dottie.app`).
      - name: Build für iOS-Simulator
        run: |
          cd ios
          xcodebuild -project Dottie.xcodeproj -scheme Dottie \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Simulator-App als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: dottie-ios-simulator-app
          path: ios/build/Build/Products/Debug-iphonesimulator/Dottie.app

name: Build APK

on:
  push:
    branches:
      - main
      - claude/casual-game-mobile-levels-9twgfw
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Prepare release keystore
        # Sobald das Secret PUNKT_KEYSTORE_BASE64 gesetzt ist (Keystore-
        # Rotation, siehe PUBLISHING.md), signiert der Build mit dem echten
        # Keystore. Ohne das Secret bleibt es beim eingecheckten
        # Test-Keystore — gut genug für Test-APKs, tabu für den Store.
        env:
          PUNKT_KEYSTORE_BASE64: ${{ secrets.PUNKT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PUNKT_KEYSTORE_BASE64" ]; then
            printf '%s' "$PUNKT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/punkt-release.keystore"
            echo "PUNKT_KEYSTORE_FILE=$RUNNER_TEMP/punkt-release.keystore" >> "$GITHUB_ENV"
            echo "Signiere mit rotiertem Keystore aus Secret."
          else
            echo "Kein PUNKT_KEYSTORE_BASE64-Secret gesetzt — Test-Keystore wird verwendet."
          fi

      - name: Build APKs and App Bundle
        env:
          PUNKT_KEYSTORE_PASSWORD: ${{ secrets.PUNKT_KEYSTORE_PASSWORD }}
          PUNKT_KEY_ALIAS: ${{ secrets.PUNKT_KEY_ALIAS }}
          PUNKT_KEY_PASSWORD: ${{ secrets.PUNKT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: punkt-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: punkt-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload release App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: punkt-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Publish APKs as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Test-APK Build ${{ github.run_number }}
          prerelease: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab

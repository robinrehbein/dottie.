name: Build APK

on:
  push:
    branches:
      - main
      # Jeder Arbeits-Branch bekommt den Build-Check samt Debug-APK als
      # Artefakt. Als Muster statt einzelner Namen, damit hier nichts
      # stehen bleibt, wenn ein Branch gemerged und geloescht ist.
      - 'claude/**'
  # Bewusst kein pull_request-Trigger: Die Arbeits-Branches heissen alle
  # claude/**, der Push-Trigger deckt sie also schon ab — ein zweiter
  # Trigger wuerde jeden Lauf nur verdoppeln. Ein Branch mit anderem Namen
  # laesst sich ueber "Run workflow" pruefen.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # :core ist ein Multiplattform-Modul und kennt kein
      # testDebugUnitTest — seine Tests heissen jvmTest. Ohne den
      # expliziten Aufruf liefen sie (inkl. der Paritaets-Vektoren) in der
      # CI nie mit. Dasselbe gilt für :ui: Seine Desktop-Tests (Bedienung,
      # Nebel, Sammlung, Start-Tap, Rendering) heissen ebenfalls jvmTest.
      - name: Run unit tests
        run: ./gradlew --no-daemon :core:jvmTest testDebugUnitTest :ui:jvmTest

      # Auf dem Arbeits-Branch reicht ein Build-Check: Kompiliert alles?
      # Die Debug-APK landet als Workflow-Artefakt (Actions → Run →
      # Artifacts), falls ein Stand ausnahmsweise vor dem Merge aufs Gerät
      # soll. Releases (apk-build-N) entstehen ausschließlich aus main.
      - name: Build-Check (Branch)
        if: github.ref != 'refs/heads/main'
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK (Branch-Artefakt)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: punkt-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # assembleDebug im Root-Build-Check baut :wear automatisch mit (jedes
      # com.android.application-Modul hängt sein assembleDebug an den
      # gleichnamigen Root-Task) — die Wear-APK landet daher genauso als
      # Branch-Artefakt wie die Phone-APK.
      - name: Upload debug wear APK (Branch-Artefakt)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: punkt-wear-debug-apk
          path: wear/build/outputs/apk/debug/wear-debug.apk

      - name: Prepare release keystore
        # Sobald das Secret PUNKT_KEYSTORE_BASE64 gesetzt ist (Keystore-
        # Rotation, siehe PUBLISHING.md), signiert der Build mit dem echten
        # Keystore. Ohne das Secret bleibt es beim eingecheckten
        # Test-Keystore — gut genug für Test-APKs, tabu für den Store.
        if: github.ref == 'refs/heads/main'
        env:
          PUNKT_KEYSTORE_BASE64: ${{ secrets.PUNKT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PUNKT_KEYSTORE_BASE64" ]; then
            printf '%s' "$PUNKT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/punkt-release.keystore"
            echo "PUNKT_KEYSTORE_FILE=$RUNNER_TEMP/punkt-release.keystore" >> "$GITHUB_ENV"
            echo "Signiere mit rotiertem Keystore aus Secret."
          else
            echo "Kein PUNKT_KEYSTORE_BASE64-Secret gesetzt — Test-Keystore wird verwendet."
          fi

      - name: Build APKs and App Bundle
        if: github.ref == 'refs/heads/main'
        env:
          PUNKT_KEYSTORE_PASSWORD: ${{ secrets.PUNKT_KEYSTORE_PASSWORD }}
          PUNKT_KEY_ALIAS: ${{ secrets.PUNKT_KEY_ALIAS }}
          PUNKT_KEY_PASSWORD: ${{ secrets.PUNKT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Upload debug APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: punkt-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: punkt-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload release App Bundle
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: punkt-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload release mapping
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: punkt-release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      # bundleRelease im Root baut auch :wear mit — seit der Signing-Config
      # in wear/build.gradle.kts ist das Wear-AAB store-tauglich signiert
      # und wird in der Play Console als zweites Bundle (Formfaktor Wear OS)
      # im selben Release hochgeladen, siehe PUBLISHING.md.
      - name: Upload release wear App Bundle
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: punkt-wear-release-aab
          path: wear/build/outputs/bundle/release/wear-release.aab

      - name: Publish APKs as release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Test-APK Build ${{ github.run_number }}
          prerelease: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            wear/build/outputs/apk/debug/wear-debug.apk
            wear/build/outputs/bundle/release/wear-release.aab

  # Nach jedem Merge auf main: genau den neuesten erfolgreichen Build in
  # die freigeschalteten Play-Tracks stellen. Der Job bleibt aus, bis das
  # app-spezifische Servicekonto eingerichtet und PLAY_PUBLISH_ENABLED=true
  # gesetzt ist. PLAY_TRACKS kann nach Produktionsfreigabe erweitert werden.
  play-release:
    if: github.ref == 'refs/heads/main' && vars.PLAY_PUBLISH_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: dottie-play-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Nur den neuesten main-Commit veröffentlichen
        id: latest
        run: |
          git fetch --no-tags origin main
          if [ "$GITHUB_SHA" = "$(git rev-parse origin/main)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Ein neuerer main-Commit ist bereits vorhanden; dieser Build wird übersprungen."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Play-Upload-Voraussetzungen
        if: steps.latest.outputs.current == 'true'
        env:
          KEYSTORE: ${{ secrets.PUNKT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Keystore nicht rotiert (PUNKT_KEYSTORE_BASE64 fehlt) — der Test-Keystore darf nie in den Play Store."
            exit 1
          fi

      - name: Bei Google Cloud anmelden
        id: auth
        if: steps.latest.outputs.current == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/632961826833/locations/global/workloadIdentityPools/dottie-github-publishing/providers/github-dottie
          service_account: dottie-play-publisher@dottie-play-publishing.iam.gserviceaccount.com

      - name: Download AAB
        if: steps.latest.outputs.current == 'true'
        uses: actions/download-artifact@v4
        with:
          name: punkt-release-aab

      - name: Download mapping
        if: steps.latest.outputs.current == 'true'
        uses: actions/download-artifact@v4
        with:
          name: punkt-release-mapping

      - name: Download Wear AAB
        if: steps.latest.outputs.current == 'true'
        uses: actions/download-artifact@v4
        with:
          name: punkt-wear-release-aab

      - name: In Google Play veröffentlichen
        if: steps.latest.outputs.current == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: de.robinrehbein.pointless
          releaseFiles: app-release.aab
          tracks: ${{ vars.PLAY_TRACKS || 'internal,alpha' }}
          status: completed
          changesNotSentForReview: false
          whatsNewDirectory: store/whatsnew
          mappingFile: mapping.txt

      - name: Wear OS im internen Test veröffentlichen
        if: steps.latest.outputs.current == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.auth.outputs.credentials_file_path }}
          packageName: de.robinrehbein.pointless
          releaseFiles: wear-release.aab
          tracks: wear:qa
          status: completed
          changesNotSentForReview: false
          whatsNewDirectory: store/whatsnew

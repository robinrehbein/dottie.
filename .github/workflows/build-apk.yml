name: Build APK

on:
  push:
    branches:
      - main
      - claude/casual-game-mobile-levels-9twgfw
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # Auf dem Arbeits-Branch reicht ein Build-Check: Kompiliert alles?
      # Die Debug-APK landet als Workflow-Artefakt (Actions → Run →
      # Artifacts), falls ein Stand ausnahmsweise vor dem Merge aufs Gerät
      # soll. Releases (apk-build-N) entstehen ausschließlich aus main.
      - name: Build-Check (Branch)
        if: github.ref != 'refs/heads/main'
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK (Branch-Artefakt)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: punkt-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # assembleDebug im Root-Build-Check baut :wear automatisch mit (jedes
      # com.android.application-Modul hängt sein assembleDebug an den
      # gleichnamigen Root-Task) — die Wear-APK landet daher genauso als
      # Branch-Artefakt wie die Phone-APK.
      - name: Upload debug wear APK (Branch-Artefakt)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: punkt-wear-debug-apk
          path: wear/build/outputs/apk/debug/wear-debug.apk

      - name: Prepare release keystore
        # Sobald das Secret PUNKT_KEYSTORE_BASE64 gesetzt ist (Keystore-
        # Rotation, siehe PUBLISHING.md), signiert der Build mit dem echten
        # Keystore. Ohne das Secret bleibt es beim eingecheckten
        # Test-Keystore — gut genug für Test-APKs, tabu für den Store.
        if: github.ref == 'refs/heads/main'
        env:
          PUNKT_KEYSTORE_BASE64: ${{ secrets.PUNKT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PUNKT_KEYSTORE_BASE64" ]; then
            printf '%s' "$PUNKT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/punkt-release.keystore"
            echo "PUNKT_KEYSTORE_FILE=$RUNNER_TEMP/punkt-release.keystore" >> "$GITHUB_ENV"
            echo "Signiere mit rotiertem Keystore aus Secret."
          else
            echo "Kein PUNKT_KEYSTORE_BASE64-Secret gesetzt — Test-Keystore wird verwendet."
          fi

      - name: Build APKs and App Bundle
        if: github.ref == 'refs/heads/main'
        env:
          PUNKT_KEYSTORE_PASSWORD: ${{ secrets.PUNKT_KEYSTORE_PASSWORD }}
          PUNKT_KEY_ALIAS: ${{ secrets.PUNKT_KEY_ALIAS }}
          PUNKT_KEY_PASSWORD: ${{ secrets.PUNKT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Upload debug APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: punkt-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: punkt-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload release App Bundle
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: punkt-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      # bundleRelease im Root baut auch :wear mit — seit der Signing-Config
      # in wear/build.gradle.kts ist das Wear-AAB store-tauglich signiert
      # und wird in der Play Console als zweites Bundle (Formfaktor Wear OS)
      # im selben Release hochgeladen, siehe PUBLISHING.md.
      - name: Upload release wear App Bundle
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: punkt-wear-release-aab
          path: wear/build/outputs/bundle/release/wear-release.aab

      - name: Publish APKs as release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Test-APK Build ${{ github.run_number }}
          prerelease: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            wear/build/outputs/apk/debug/wear-debug.apk
            wear/build/outputs/bundle/release/wear-release.aab

  # Läuft nur bei manuellem Start (Actions → Build APK → "Run workflow"
  # auf main) und lädt das AAB in den internen Test-Track der Play
  # Console. Braucht die Secrets PLAY_SERVICE_ACCOUNT_JSON und den
  # rotierten Keystore (PUNKT_KEYSTORE_BASE64) — Anleitung in
  # PUBLISHING.md. Jeder Upload braucht einen frischen versionCode.
  play-internal:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check Play-Upload-Voraussetzungen
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KEYSTORE: ${{ secrets.PUNKT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON fehlt — siehe PUBLISHING.md."
            exit 1
          fi
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Keystore nicht rotiert (PUNKT_KEYSTORE_BASE64 fehlt) — der Test-Keystore darf nie in den Play Store."
            exit 1
          fi

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: punkt-release-aab

      - name: Upload in den internen Test-Track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.robinrehbein.pointless
          releaseFiles: app-release.aab
          track: internal
          status: draft

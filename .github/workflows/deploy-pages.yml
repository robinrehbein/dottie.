# Veröffentlicht die Datenschutzerklärung auf GitHub Pages unter der
# eigenen Domain dottie.robinrehbein.de.
# Voraussetzung: Settings → Pages → Source "GitHub Actions".
#
# Bis v2.22 lag hier auch die Web-Version des Spiels (web/). Die ist mit
# der Konzentration auf die nativen Apps entfallen — der letzte Stand
# steht im Commit b4ed73f. Was bleibt, hängt an der laufenden Android-App
# und muss deshalb erreichbar bleiben:
#
# Site-Layout:
#   /             -> Datenschutzerklärung (damit die Domain nicht ins Leere läuft)
#   /datenschutz/ -> dieselbe Seite unter der URL, die im Play-Eintrag steht
#   /app-ads.txt  -> Verkäufer-Verifikation für AdMob
name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nie zwei Deployments gleichzeitig; laufende nicht abbrechen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: aktiviert Pages (Source "GitHub Actions") beim ersten
      # Lauf automatisch, falls es noch nicht eingeschaltet ist
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Site zusammenstellen
        run: |
          mkdir -p _site/datenschutz
          # Die im Play-Eintrag hinterlegte URL endet auf /datenschutz/ und
          # darf sich nicht ändern — ein toter Datenschutz-Link kann den
          # Store-Eintrag kosten. Dieselbe Seite liegt zusätzlich auf der
          # Wurzel, damit die Domain nicht mit einem 404 antwortet.
          cp docs/index.html _site/datenschutz/index.html
          cp docs/index.html _site/index.html
          # AdMob prüft die Verkäufer-Verifikation unter der Domain, die im
          # Play-Eintrag als Website steht.
          cp docs/app-ads.txt _site/app-ads.txt
          # Pages soll die Dateien 1:1 ausliefern, kein Jekyll-Build
          touch _site/.nojekyll
          # Eigene Domain. Die Datei muss im veröffentlichten Verzeichnis
          # liegen, nicht im Repo-Wurzelverzeichnis: Beim Deployment über
          # Actions wird ausschließlich das Artefakt ausgeliefert, ein
          # CNAME daneben im Repo bliebe wirkungslos.
          echo "dottie.robinrehbein.de" > _site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
